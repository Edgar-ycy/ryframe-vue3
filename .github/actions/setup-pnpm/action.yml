name: Setup pnpm
description: Activate the exact pnpm version declared by package.json through Corepack

inputs:
  working-directory:
    description: Directory containing package.json
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Activate declared pnpm version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        pnpm_version="$(
          node <<'NODE'
        const packageManager = require('./package.json').packageManager
        const match = /^pnpm@(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)(?:\+.+)?$/.exec(packageManager ?? '')
        if (!match) throw new Error('packageManager must declare an exact pnpm version')
        process.stdout.write(match[1])
        NODE
        )"
        corepack enable
        corepack prepare "pnpm@${pnpm_version}" --activate
        test "$(corepack pnpm --version)" = "$pnpm_version"

    - name: Configure deterministic pnpm store
      id: store
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        store_path="$RUNNER_TEMP/pnpm-store"
        echo "npm_config_store_dir=$store_path" >> "$GITHUB_ENV"
        fingerprint="$(node -e "const{createHash}=require('node:crypto');const{readFileSync}=require('node:fs');const h=createHash('sha256');for(const p of ['package.json','pnpm-lock.yaml','pnpm-workspace.yaml'])h.update(readFileSync(p));process.stdout.write(h.digest('hex'))")"
        echo "path=$store_path" >> "$GITHUB_OUTPUT"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ steps.store.outputs.path }}
        key: v1-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.store.outputs.fingerprint }}
        restore-keys: |
          v1-pnpm-${{ runner.os }}-${{ runner.arch }}-
