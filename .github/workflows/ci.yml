name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 代码质量门禁
  # ============================================================
  check:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: pnpm cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec vue-tsc --noEmit

      - name: Production build
        run: pnpm run build

  # ============================================================
  # 代码风格检查 (条件执行)
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: check
    # 项目配置相应工具后才执行；一旦执行，失败会阻断 CI。
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: pnpm cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        if: hashFiles('eslint.config.*', '.eslintrc*') != ''
        run: pnpm exec eslint .

      - name: Run Stylelint
        if: hashFiles('.stylelintrc*', 'stylelint.config.*') != ''
        run: pnpm exec stylelint "**/*.{css,scss,vue}"

  # ============================================================
  # 单元测试 (条件执行)
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: pnpm cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: hashFiles('**/vitest.config.*', '**/*.test.ts', '**/*.spec.ts') != ''
        run: pnpm exec vitest run --reporter=verbose
