name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  static:
    name: Static Gate (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Run stable static gate
        run: corepack pnpm check --stage static --upstream

  unit:
    name: Unit Tests (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run stable unit gate
        run: corepack pnpm check --stage unit

  build:
    name: Production Build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run stable build gate
        run: corepack pnpm build --real
        env:
          VITE_APP_BUILD_COMMIT: ${{ github.sha }}

      - name: 保存待验收的生产构建
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-production-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser Smoke (Node 24)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Restore Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: v1-playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser for deterministic smoke tests
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: 验收开发服务器浏览器流程
        run: corepack pnpm check --stage browser --fixture core --server dev

      - name: 读取本次门禁的生产构建
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: frontend-production-${{ github.sha }}-${{ github.run_attempt }}
          path: dist

      - name: 验收生产构建浏览器流程
        run: corepack pnpm check --stage browser --fixture core --server preview

      - name: Upload browser failure artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .local-tests/playwright/report
            .local-tests/playwright/results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  windows-smoke:
    name: Windows Smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Windows 验证完整静态任务和单元测试；浏览器 smoke 由 Linux 主门禁覆盖。
      - name: Run Windows static smoke
        run: corepack pnpm check --stage static

      - name: Run Windows unit smoke
        run: corepack pnpm check --stage unit

  # 分支保护只绑定这个稳定名称；事件不适用的 job 可以 skipped，失败和取消均拒绝。
  required:
    name: Required
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - static
      - unit
      - build
      - browser
      - windows-smoke
    steps:
      - name: 检出汇总规则
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup required-check Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: 汇总必须门禁
        env:
          EVENT_NAME: ${{ github.event_name }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
        run: >-
          node scripts/check-workflows.mjs required
          --event "$EVENT_NAME"
          --job "static=$STATIC_RESULT"
          --job "unit=$UNIT_RESULT"
          --job "build=$BUILD_RESULT"
          --job "browser=$BROWSER_RESULT"
          --job "windows-smoke=$WINDOWS_RESULT"
