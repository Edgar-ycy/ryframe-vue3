name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 3 * * 3'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  static:
    name: Static Gate (Node 24)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Run stable static gate
        run: pnpm ci:static

  unit:
    name: Unit Tests (Node 24)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run stable unit gate
        run: pnpm ci:unit

  build:
    name: Production Build (Node 24)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run stable build gate
        run: pnpm ci:build
        env:
          VITE_APP_BUILD_COMMIT: ${{ github.sha }}

  browser:
    name: Browser Smoke (Node 24)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: v1-playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser for deterministic smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run stable browser gate
        run: pnpm ci:browser

      - name: Upload browser failure artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-smoke-${{ github.sha }}
          path: |
            .local-tests/playwright/report
            .local-tests/playwright/results
          if-no-files-found: error
          retention-days: 14

  node-22-compatibility:
    name: Node 22.22 Compatibility
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js 22.22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Run deterministic unit tests
        run: pnpm test:unit

      - name: Production build
        run: pnpm build

  supply-chain:
    name: Supply Chain and SBOM
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check dependency licenses
        run: pnpm check:supply-chain-policy

      - name: Generate CycloneDX SBOM
        run: pnpm sbom:generate -- --output "${RUNNER_TEMP}/ryframe-vue3.cdx.json"

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ryframe-vue3-cyclonedx
          path: ${{ runner.temp }}/ryframe-vue3.cdx.json
          if-no-files-found: error
          retention-days: 14

  osv-scan:
    name: OSV Vulnerability Scan
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  windows-smoke:
    name: Windows Smoke
    if: ${{ github.event_name != 'schedule' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Windows 验证策略脚本、契约路径、类型和单元测试；浏览器 smoke 由 Linux 主门禁覆盖。
      - name: Run Windows policy tests
        run: pnpm test:policies

      - name: Check Windows API contract paths
        run: pnpm api:check

      - name: Run Windows static smoke
        run: pnpm typecheck && pnpm test:unit

  # 分支保护只绑定这个稳定名称；事件不适用的 job 可以 skipped，失败和取消均拒绝。
  required:
    name: Required
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - static
      - unit
      - build
      - browser
      - node-22-compatibility
      - supply-chain
      - osv-scan
      - windows-smoke
    steps:
      - name: 检出汇总规则
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup required-check Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: 汇总必须门禁
        env:
          EVENT_NAME: ${{ github.event_name }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          NODE_22_RESULT: ${{ needs.node-22-compatibility.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          OSV_RESULT: ${{ needs.osv-scan.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
        run: >-
          node scripts/check-required-jobs.mjs
          --event "$EVENT_NAME"
          --job "static=$STATIC_RESULT"
          --job "unit=$UNIT_RESULT"
          --job "build=$BUILD_RESULT"
          --job "browser=$BROWSER_RESULT"
          --job "node-22-compatibility=$NODE_22_RESULT"
          --job "supply-chain=$SUPPLY_CHAIN_RESULT"
          --job "osv-scan=$OSV_RESULT"
          --job "windows-smoke=$WINDOWS_RESULT"
