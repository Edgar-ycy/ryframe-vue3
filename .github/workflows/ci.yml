name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 3 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  check:
    name: Frontend Quality Gate (Node 24)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check GitHub workflow syntax and references
        run: pnpm check:workflows

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Reject prerelease dependencies
        run: pnpm check:dependencies

      - name: Enforce source size limits
        run: pnpm check:source-size

      - name: Check local and exact upstream API contract and operation usage
        run: pnpm api:check:upstream

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Run ESLint and Stylelint
        run: |
          pnpm lint
          pnpm lint:styles

      - name: Run deterministic unit tests
        run: pnpm test:unit

      - name: Build production bundle
        run: pnpm build
        env:
          VITE_APP_BUILD_COMMIT: ${{ github.sha }}

      - name: Enforce bundle budget
        run: pnpm check:bundle

  node-22-compatibility:
    name: Node 22.22 Compatibility
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js 22.22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Run deterministic unit tests
        run: pnpm test:unit

      - name: Production build
        run: pnpm build
