name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Static Gate (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: ./.github/actions/setup-pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check --stage contract

  unit:
    name: Unit Tests (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: ./.github/actions/setup-pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec vitest run

  build:
    name: Production Build (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: ./.github/actions/setup-pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build

  browser:
    name: Browser Smoke (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: ./.github/actions/setup-pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm exec playwright test
      - name: 保存浏览器失败产物
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local-tests/playwright
          if-no-files-found: ignore
          retention-days: 14

  windows-smoke:
    name: Windows Smoke
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: ./.github/actions/setup-pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check --stage contract
      - run: corepack pnpm build

  required:
    name: Required
    if: always()
    needs: [static, unit, build, browser, windows-smoke]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ join(needs.*.result, ',') }}' = 'success,success,success,success,success'
