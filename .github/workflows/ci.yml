name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 3 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  check:
    name: Frontend Quality Gate (Node 24)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for deterministic smoke tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Check GitHub workflow syntax and references
        run: pnpm check:workflows

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Reject prerelease dependencies
        run: pnpm check:dependencies

      - name: Test supply-chain policies
        run: pnpm test:policies

      - name: Enforce source size limits
        run: pnpm check:source-size

      - name: Check local and exact upstream API contract and operation usage
        run: pnpm api:check:upstream

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Run ESLint and Stylelint
        run: |
          pnpm lint
          pnpm lint:styles

      - name: Run deterministic unit tests
        run: pnpm test:unit

      - name: Run deterministic browser smoke tests
        run: pnpm test:browser-smoke

      - name: Build production bundle
        run: pnpm build
        env:
          VITE_APP_BUILD_COMMIT: ${{ github.sha }}

      - name: Enforce bundle budget
        run: pnpm check:bundle

  node-22-compatibility:
    name: Node 22.22 Compatibility
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js 22.22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Run deterministic unit tests
        run: pnpm test:unit

      - name: Production build
        run: pnpm build

  supply-chain:
    name: Supply Chain and SBOM
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup default Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Check dependency licenses
        run: pnpm check:supply-chain-policy

      - name: Generate CycloneDX SBOM
        run: pnpm sbom:generate -- --output "${RUNNER_TEMP}/ryframe-vue3.cdx.json"

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ryframe-vue3-cyclonedx
          path: ${{ runner.temp }}/ryframe-vue3.cdx.json
          if-no-files-found: error
          retention-days: 14

  osv-scan:
    name: OSV Vulnerability Scan
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
