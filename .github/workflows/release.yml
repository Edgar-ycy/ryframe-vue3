name: Release

on:
  push:
    branches: [ main ]

# 防止并发推送
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # ============================================================
  # Nightly 自动发布 (push main, 复用固定 nightly tag)
  # ============================================================
  nightly:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: pnpm cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm run build

      - name: Package dist
        run: |
          cd dist
          tar -czf ../ryframe-vue3-nightly-dist.tar.gz .
          zip -r ../ryframe-vue3-nightly-dist.zip .

      - name: Force update nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly
          body: |
            ## 🔧 Nightly Build

            自动构建于 `main` 分支。

            - Commit: ${{ github.sha }}
            - 时间: ${{ github.event.head_commit.timestamp }}

            > ⚠️ 这是开发中的快照版本，可能不稳定。
          prerelease: true
          files: |
            ryframe-vue3-nightly-dist.tar.gz
            ryframe-vue3-nightly-dist.zip

  # RC/stable artifacts are built and published only by the coordinated
  # backend release workflow after all cross-repository gates pass.
