name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: frontend-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Validate and publish frontend source release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: 验证标签属于 main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
      - name: 等待同一标签的前端 CI 与扩展 CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          deadline="$((SECONDS + 5400))"
          for workflow in ci.yml extended-ci.yml; do
            while true; do
              (( SECONDS < deadline )) || {
                echo "Timed out waiting for ${workflow} on ${GITHUB_REF_NAME}." >&2
                exit 1
              }
              run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${sha}&event=push&per_page=100" \
                --jq '.workflow_runs | map(select(.head_branch == env.GITHUB_REF_NAME)) | max_by(.run_number) // empty')"
              if [[ -z "$run" ]]; then
                sleep 10
                continue
              fi
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
              if [[ "$status" != completed ]]; then
                sleep 20
                continue
              fi
              [[ "$conclusion" == success ]] || {
                echo "${workflow} concluded ${conclusion}." >&2
                exit 1
              }
              break
            done
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.21.0', package-manager-cache: false}
      - uses: ./.github/actions/setup-pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check --stage contract
      - run: corepack pnpm exec vitest run
      - run: corepack pnpm build
      - name: 创建前端源码 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > "$notes"
          test -s "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "RyFrame Vue3 ${GITHUB_REF_NAME}" --notes-file "$notes" --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "RyFrame Vue3 ${GITHUB_REF_NAME}" --notes-file "$notes" --latest
          fi
