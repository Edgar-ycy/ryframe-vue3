name: Nightly Source Release

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]

# 防止并发推送
concurrency:
  group: nightly-source-release
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # ============================================================
  # Nightly 自动发布（push main，复用固定 nightly tag）
  # ============================================================
  nightly:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Force update nightly tag
        env:
          NIGHTLY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git tag -f nightly "${NIGHTLY_SHA}"
          git push -f origin refs/tags/nightly

      - name: Remove custom Nightly assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          error_log="$(mktemp)"
          trap 'rm -f "${error_log}"' EXIT
          if release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" --jq '.id' 2>"${error_log}")"; then
            asset_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[].id')"
            while IFS= read -r asset_id; do
              if [ -n "${asset_id}" ]; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              fi
            done <<< "${asset_ids}"
          elif grep -q 'HTTP 404' "${error_log}"; then
            echo "Nightly release does not exist yet; no assets to remove."
          else
            cat "${error_log}" >&2
            exit 1
          fi

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly
          body: |
            ## 🔧 Nightly Source Snapshot

            自动发布自 `main` 分支，仅提供 GitHub 生成的 Source code 归档。

            - Commit: ${{ github.event.workflow_run.head_sha }}
            - CI 完成时间: ${{ github.event.workflow_run.updated_at }}

            > ⚠️ 这是开发中的快照版本，可能不稳定。
          prerelease: true
          make_latest: false
